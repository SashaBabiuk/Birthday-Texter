<div class="table-wrap"><table><thead><tr><th>Attempted</th><th>Recipient</th><th>Result</th><th>Message</th><th>Error</th></tr></thead><tbody>{% for row in history %}<tr><td>{{ row.attempted_at.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ row.recipient }}</td><td class="{{ 'ok' if row.status == 'sent' else 'bad' }}">{{ row.status }}</td><td class="preview">{{ row.message }}</td><td>{{ row.error or '—' }}</td></tr>{% else %}<tr><td colspan="5">No sends recorded.</td></tr>{% endfor %}</tbody></table></div>
